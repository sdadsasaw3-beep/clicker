<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <script src="https://st.max.ru/js/max-web-app.js"></script>

    <title>Кликер</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .game {
            max-width: 500px;
            margin: auto;
            padding: 25px;
        }

        #user {
            color: #aaa;
            margin-bottom: 10px;
        }

        #coins {
            font-size: 50px;
            color: gold;
            margin: 25px;
        }

        #click {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            background: orange;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        #click:active {
            transform: scale(0.9);
        }

        .shop {
            margin-top: 30px;
            background: #1d1d1d;
            padding: 20px;
            border-radius: 15px;
        }

        .item button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #2196f3;
            color: white;
            font-size: 16px;
        }

        .item {
            background: #292929;
            padding: 15px;
            margin-top: 12px;
            border-radius: 12px;
        }

        #stats {
            color: #aaa;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="game">

    <div id="user">Загрузка...</div>

    <h1>🪙 Кликер</h1>

    <div id="coins">0</div>

    <button id="click">КЛИК!</button>

    <div id="stats">
        За клик: 1 🪙<br>
        Автоклик: 0 🪙/сек
    </div>

    <div class="shop">

        <h2>🛒 МАГАЗИН</h2>

        <div class="item">
            ⚡ <b>Усиленный клик</b>
            <br>
            +1 монета за клик

            <button id="buyPower">
                Купить — 50 🪙
            </button>
        </div>

        <div class="item">
            🚀 <b>Мега-клик</b>
            <br>
            +5 монет за клик

            <button id="buyMega">
                Купить — 250 🪙
            </button>
        </div>

        <div class="item">
            🤖 <b>Автокликер</b>
            <br>
            +1 монета каждую секунду

            <button id="buyAuto">
                Купить — 500 🪙
            </button>
        </div>

    </div>

</div>

<script>

let coins = Number(localStorage.getItem("coins")) || 0;
let power = Number(localStorage.getItem("power")) || 1;
let autoClick = Number(localStorage.getItem("autoClick")) || 0;

let powerPrice = 50;
let megaPrice = 250;
let autoPrice = 500;

const coinsText =
    document.getElementById("coins");

const stats =
    document.getElementById("stats");

const clickButton =
    document.getElementById("click");

const buyPower =
    document.getElementById("buyPower");

const buyMega =
    document.getElementById("buyMega");

const buyAuto =
    document.getElementById("buyAuto");


// MAX WebApp
if (window.WebApp) {
    try {
        window.WebApp.ready();
        window.WebApp.expand();

        const user =
            window.WebApp.initDataUnsafe?.user;

        if (user) {
            document.getElementById("user").textContent =
                "👋 Привет, " +
                (user.first_name || "игрок") +
                "!";
        }
    } catch (error) {
        console.log("MAX WebApp:", error);
    }
}


// Клик
clickButton.onclick = function () {

    coins += power;

    save();
    update();

};


// Усиленный клик
buyPower.onclick = function () {

    if (coins >= powerPrice) {

        coins -= powerPrice;
        power++;

        powerPrice =
            Math.floor(powerPrice * 1.5);

        save();
        update();
    }

};


// Мега-клик
buyMega.onclick = function () {

    if (coins >= megaPrice) {

        coins -= megaPrice;
        power += 5;

        megaPrice =
            Math.floor(megaPrice * 1.7);

        save();
        update();
    }

};


// Автокликер
buyAuto.onclick = function () {

    if (coins >= autoPrice) {

        coins -= autoPrice;
        autoClick++;

        autoPrice =
            Math.floor(autoPrice * 2);

        save();
        update();
    }

};


// Автоматическое получение монет
setInterval(function () {

    if (autoClick > 0) {

        coins += autoClick;

        save();
        update();
    }

}, 1000);


// Сохранение
function save() {

    localStorage.setItem(
        "coins",
        coins
    );

    localStorage.setItem(
        "power",
        power
    );

    localStorage.setItem(
        "autoClick",
        autoClick
    );
}


// Обновление интерфейса
function update() {

    coinsText.textContent =
        coins;

    stats.innerHTML =
        "За клик: " + power +
        " 🪙<br>" +
        "Автоклик: " + autoClick +
        " 🪙/сек";

    buyPower.textContent =
        "Купить — " + powerPrice + " 🪙";

    buyMega.textContent =
        "Купить — " + megaPrice + " 🪙";

    buyAuto.textContent =
        "Купить — " + autoPrice + " 🪙";

    buyPower.disabled =
        coins < powerPrice;

    buyMega.disabled =
        coins < megaPrice;

    buyAuto.disabled =
        coins < autoPrice;
}


update();

</script>

</body>
</html>
